<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Leave - HRMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .page-subtitle {
            color: #6b7280;
            margin-top: 5px;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .btn-submit {
            background: #0d6efd;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #0b5ed7;
        }

        .btn-back {
            border-radius: 10px;
            padding: 10px 18px;
        }

        .required {
            color: #dc3545;
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <!-- HEADER -->
    <div class="page-header">

        <div>
            <h1 class="page-title">
                <i class="bi bi-calendar-plus"></i>
                Apply for Leave
            </h1>

            <p class="page-subtitle">
                Submit a new leave request
            </p>
        </div>

        <a
            href="{{ url_for('leave_list') }}"
            class="btn btn-outline-secondary btn-back"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Leave
        </a>

    </div>


    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                    ></button>
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- FORM -->
    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('apply_leave') }}"
        >

            <div class="row g-4">

                <!-- EMPLOYEE -->
                <div class="col-md-6">

                    <label class="form-label">
                        Employee <span class="required">*</span>
                    </label>

                    <select
                        name="employee"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                            <option value="{{ employee.name }}">
                                {{ employee.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- LEAVE TYPE -->
                <div class="col-md-6">

                    <label class="form-label">
                        Leave Type <span class="required">*</span>
                    </label>

                    <select
                        name="leave_type"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="Annual Leave">
                            Annual Leave
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Maternity Leave">
                            Maternity Leave
                        </option>

                        <option value="Paternity Leave">
                            Paternity Leave
                        </option>

                        <option value="Emergency Leave">
                            Emergency Leave
                        </option>

                        <option value="Unpaid Leave">
                            Unpaid Leave
                        </option>

                    </select>

                </div>


                <!-- START DATE -->
                <div class="col-md-6">

                    <label class="form-label">
                        Start Date <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        required
                    >

                </div>


                <!-- END DATE -->
                <div class="col-md-6">

                    <label class="form-label">
                        End Date <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        name="end_date"
                        class="form-control"
                        required
                    >

                </div>


                <!-- REASON -->
                <div class="col-12">

                    <label class="form-label">
                        Reason <span class="required">*</span>
                    </label>

                    <textarea
                        name="reason"
                        class="form-control"
                        rows="5"
                        placeholder="Enter the reason for your leave..."
                        required
                    ></textarea>

                </div>


                <!-- BUTTONS -->
                <div class="col-12">

                    <div class="d-flex justify-content-end gap-2">

                        <a
                            href="{{ url_for('leave_list') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn-submit"
                        >
                            <i class="bi bi-send"></i>
                            Submit Leave Request
                        </button>

                    </div>

                </div>

            </div>

        </form>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Add this script to EVERY HRMS page, immediately before </body> -->

<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
