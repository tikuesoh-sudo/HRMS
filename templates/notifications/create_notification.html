<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Notification - HRMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .page {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card-custom {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        h2 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 11px 13px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            border-radius: 9px;
            padding: 11px 20px;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            border-radius: 9px;
            padding: 11px 20px;
        }
        /* Add these rules to every page CSS file so the saved
    Settings dark mode applies across the entire HRMS system. */

html[data-theme="dark"] body {
    background: #0b1120 !important;
    color: #e5e7eb !important;
}

html[data-theme="dark"] .topbar,
html[data-theme="dark"] .card,
html[data-theme="dark"] .dashboard-card,
html[data-theme="dark"] .employee-card,
html[data-theme="dark"] .table-card,
html[data-theme="dark"] .content-card,
html[data-theme="dark"] .report-card,
html[data-theme="dark"] .profile-card,
html[data-theme="dark"] .payroll-card {
    background: #111827 !important;
    color: #e5e7eb !important;
    border-color: #263244 !important;
}

html[data-theme="dark"] table {
    color: #e5e7eb !important;
}

html[data-theme="dark"] .table {
    --bs-table-bg: #111827;
    --bs-table-color: #e5e7eb;
    --bs-table-border-color: #263244;
}

html[data-theme="dark"] .form-control,
html[data-theme="dark"] .form-select,
html[data-theme="dark"] textarea {
    background: #0f172a !important;
    color: #e5e7eb !important;
    border-color: #334155 !important;
}

html[data-theme="dark"] .modal-content {
    background: #111827 !important;
    color: #e5e7eb !important;
}

html[data-theme="dark"] .dropdown-menu {
    background: #111827 !important;
    border-color: #263244 !important;
}

html[data-theme="dark"] .dropdown-item {
    color: #e5e7eb !important;
}

html[data-theme="dark"] .dropdown-item:hover {
    background: #1e293b !important;
}

html[data-theme="dark"] .text-muted {
    color: #94a3b8 !important;
}

html[data-theme="dark"] .border,
html[data-theme="dark"] .border-bottom,
html[data-theme="dark"] .border-top {
    border-color: #263244 !important;
}

html[data-theme="dark"] .btn-light {
    background: #1e293b !important;
    color: #e5e7eb !important;
    border-color: #334155 !important;
}


/* COMPACT SIDEBAR */

body.compact-sidebar .main-content {
    margin-left: 82px !important;
}

body.compact-sidebar .sidebar {
    width: 82px !important;
}

body.compact-sidebar .sidebar-logo {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
}

body.compact-sidebar .sidebar-logo > div:last-child {
    display: none;
}

body.compact-sidebar .menu-title {
    display: none;
}

body.compact-sidebar .menu-item {
    justify-content: center;
    padding-left: 8px;
    padding-right: 8px;
}

body.compact-sidebar .menu-item span {
    display: none;
}

body.compact-sidebar .menu-item i {
    width: auto;
}
    </style>
</head>

<body>

    <div class="page">

        <div class="card-custom">

            <div class="mb-4">
                <h2>
                    <i class="bi bi-bell"></i>
                    Create Notification
                </h2>

                <p class="subtitle">
                    Send a new notification to the HRMS notification center.
                </p>
            </div>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div
                            class="alert alert-{{ category }} alert-dismissible fade show"
                            role="alert"
                        >
                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                            ></button>
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Notification Form -->

            <form
                method="POST"
                action="{{ url_for('create_notification') }}"
            >

                <!-- Title -->

                <div class="mb-3">

                    <label
                        for="title"
                        class="form-label"
                    >
                        Notification Title
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        placeholder="Enter notification title"
                        required
                    >

                </div>


                <!-- Type -->

                <div class="mb-3">

                    <label
                        for="type"
                        class="form-label"
                    >
                        Notification Type
                    </label>

                    <select
                        class="form-select"
                        id="type"
                        name="type"
                    >

                        <option value="General">
                            General
                        </option>

                        <option value="Leave">
                            Leave
                        </option>

                        <option value="Payroll">
                            Payroll
                        </option>

                        <option value="Employee">
                            Employee
                        </option>

                        <option value="Announcement">
                            Announcement
                        </option>

                    </select>

                </div>


                <!-- Message -->

                <div class="mb-4">

                    <label
                        for="message"
                        class="form-label"
                    >
                        Message
                    </label>

                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your notification message..."
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <a
                        href="{{ url_for('notifications') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-send"></i>
                        Create Notification
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
<script
    src="{{ url_for('static', filename='js/settings.js') }}">
</script>
</body>
</html>
